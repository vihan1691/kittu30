<style>
/* Layout concept: a framed gold-on-black invitation card that dissolves into a chat thread. */
:root{
  --ink:#0D0A07; --ink-2:#17120D; --ink-3:#221A12;
  --line:rgba(214,178,94,.24);
  --gold:#D6B25E; --gold-hi:#F4DE9A; --gold-lo:#9A7A2E;
  --ivory:#F5ECD7; --muted:#BDAE8F; --ruby:#A3202F;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --body:"Jost","Helvetica Neue",Arial,sans-serif;
  --chat:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--ivory);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,a{font:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;transition:opacity .7s ease,visibility .7s}

/* ---------- Landing ---------- */
#landing{display:flex;overflow-y:auto;background:radial-gradient(110% 55% at 50% 40%,rgba(214,178,94,.17),transparent 62%),var(--ink)}
#landing.leave{opacity:0;visibility:hidden;pointer-events:none}
.frame{position:absolute;top:12px;bottom:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));border:1px solid rgba(214,178,94,.5);pointer-events:none}
.frame::after{content:"";position:absolute;inset:6px;border:1px solid rgba(214,178,94,.2)}
.land-in{width:100%;max-width:440px;margin:auto;padding-block:44px;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{font:400 12px/1 var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--gold);padding-left:.42em}
.to{margin-top:14px;font:italic 500 24px/1 var(--display);color:var(--muted)}
.kittus{margin-top:6px;font:italic 500 clamp(34px,10vw,46px)/1 var(--display);color:var(--gold-hi)}
.thirty sup{font:italic 500 .3em/1 var(--display);vertical-align:top;position:relative;top:.2em;margin-left:.06em;letter-spacing:0}
.thirty{margin-top:4px;font:700 clamp(120px,37vw,180px)/.9 var(--display);letter-spacing:-.02em;color:var(--gold);background:linear-gradient(180deg,#FBEBB4 0%,#D6B25E 44%,#8F6E24 52%,#E7C976 70%,#B8913B 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 8px 26px rgba(214,178,94,.26))}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.thirty{-webkit-text-fill-color:transparent}}
.celebration{margin-top:8px;font:400 13px/1.6 var(--body);letter-spacing:.34em;text-transform:uppercase;padding-left:.34em}
.rule{width:64px;height:1px;margin:24px 0 20px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.forline{font:italic 500 20px/1.3 var(--display);color:var(--muted)}
.forline b{font-weight:500;color:var(--ivory)}
.cta{position:relative;margin-top:30px;border:0;cursor:pointer;appearance:none;font:500 14px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--ink);padding:19px 38px 19px 42px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#BE9A45);box-shadow:0 10px 30px rgba(214,178,94,.28),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s ease}
.cta:active{transform:scale(.97)}
.cta::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--gold-hi);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.4,1.7);opacity:0}}
.hint{margin-top:20px;font:300 12px/1.4 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* ---------- Gate ---------- */
#gate{z-index:5;display:flex;align-items:center;justify-content:center;width:100%;height:100%;margin:0;padding:0;border:0;cursor:pointer;color:var(--ivory);font:inherit;background:radial-gradient(110% 55% at 50% 45%,rgba(214,178,94,.17),transparent 62%),var(--ink)}
#gate.leave{opacity:0;visibility:hidden;pointer-events:none}
.gate-in{display:flex;flex-direction:column;align-items:center;gap:30px}
.seal{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 55%,#8F6E24);box-shadow:0 14px 40px rgba(214,178,94,.28),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -6px 14px rgba(0,0,0,.25)}
.seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(13,10,7,.45)}
.seal::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--gold-hi);animation:ring 2.2s ease-out infinite}
.seal b{font:700 48px/1 var(--display);color:var(--ink);letter-spacing:-.02em}
.gate-tap{font:400 13px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);padding-left:.34em}

/* ---------- Chat ---------- */
#chat{display:flex;flex-direction:column;background:var(--ink);opacity:0;visibility:hidden}
#chat.on{opacity:1;visibility:visible}
.bar{flex:none;background:var(--ink-2);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.back{flex:none;color:var(--gold);display:grid;place-items:center;width:20px}
.avs{flex:none;display:flex}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--ink-2);box-shadow:0 0 0 1px var(--gold)}
.av+.av{margin-left:-12px}
.av.guest{display:grid;place-items:center;font:500 14px/1 var(--body);letter-spacing:.04em;color:var(--ink);background:linear-gradient(160deg,var(--gold-hi),var(--gold-lo))}
.who{flex:1;min-width:0}
.nm{font:500 16px/1.25 var(--chat);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:400 12.5px/1.25 var(--chat);color:var(--gold)}
#mute{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--gold);display:grid;place-items:center;cursor:pointer}
#mute .slash{display:none}
#mute.off .slash{display:block}
#mute.off .wave{display:none}

.feed{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;display:flex;flex-direction:column;gap:8px;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));background-image:radial-gradient(rgba(214,178,94,.08) 1px,transparent 1.6px);background-size:22px 22px}
.day{align-self:center;margin-bottom:6px;padding:5px 12px;border-radius:8px;font:400 12px/1.2 var(--chat);color:var(--muted);background:rgba(214,178,94,.08);border:1px solid var(--line)}
.msg{align-self:flex-start;width:fit-content;max-width:min(88%,340px);padding:8px 10px 6px;border-radius:14px;border-top-left-radius:4px;background:var(--ink-3);border:1px solid var(--line);font:400 15.5px/1.42 var(--chat);color:var(--ivory);overflow-wrap:anywhere;animation:pop .38s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.t{display:block;margin-top:3px;text-align:right;font-size:11px;color:var(--muted)}
.msg.photo{padding:4px;width:min(78%,300px)}
.msg.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.msg.photo p{padding:8px 6px 0}
.typing{display:flex;gap:5px;padding:13px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:dot 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.lbl{font:500 11px/1 var(--chat);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:2px 0 10px}
.card{width:min(88%,340px)}
.when-row{display:flex;gap:14px;align-items:center}
.cal{flex:none;width:58px;border:1px solid var(--gold);border-radius:8px;overflow:hidden;text-align:center}
.cal span{display:block;background:var(--gold);color:var(--ink);font:500 11px/1 var(--body);letter-spacing:.2em;padding:5px 0 4px;padding-left:.2em}
.cal b{display:block;font:700 28px/1.25 var(--display);color:var(--gold-hi)}
.when strong{display:block;font-weight:500;font-size:15.5px;line-height:1.3}
.when small{display:block;margin-top:3px;font-size:14px;color:var(--muted)}
.pin-row{display:flex;gap:12px;align-items:flex-start}
.pin-row svg{flex:none;margin-top:2px;color:var(--gold)}
.pin-row strong{display:block;font-weight:500}
.pin-row small{display:block;margin-top:3px;font-size:14px;color:var(--muted);line-height:1.4}
.dti{font:italic 500 26px/1.2 var(--display);color:var(--gold-hi);padding:2px 0 4px}
.dress{display:grid;gap:10px}
.dress div{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:14.5px;line-height:1.4}
.dress dt{color:var(--gold);font:500 11px/1.6 var(--chat);letter-spacing:.16em;text-transform:uppercase}
.dress dd{margin:0}
.sw{display:flex;align-items:center;gap:8px}
.sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(245,236,215,.5)}
.sw .r{background:var(--ruby)}
.sw .k{background:#000}
.actions{width:min(92%,360px);display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 14px;border-radius:10px;text-align:center;text-decoration:none;font:500 14.5px/1.2 var(--chat);cursor:pointer;border:1px solid var(--gold);color:var(--gold-hi);background:transparent}
.btn.yes{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:transparent}
.btn:active{transform:scale(.98)}
.again{align-self:center;margin-top:6px;background:none;border:0;color:var(--muted);font:400 13px/1 var(--chat);text-decoration:underline;text-underline-offset:4px;padding:10px;cursor:pointer}
.note{align-self:center;max-width:300px;text-align:center;font:400 13px/1.45 var(--chat);color:var(--gold-hi)}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){
  .cta::after,.seal::after{animation:none;opacity:0}
  .msg{animation:none}
  .typing i{animation:none;opacity:.8}
  .feed{scroll-behavior:auto}
  .screen{transition-duration:.01s}
}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app">
  <section id="landing" class="screen" aria-label="Invitation" inert>
    <div class="frame"></div>
    <div class="land-in">
      <div class="eyebrow">You are invited</div>
      <div class="to">to</div>
      <div class="kittus">Kittu&rsquo;s</div>
      <div class="thirty" aria-label="30th">30<sup>th</sup></div>
      <div class="celebration">Birthday Celebration</div>
      <div class="rule"></div>
      <div class="forline" id="forLine"></div>
      <button class="cta" id="cta" type="button">Press here</button>
      <div class="hint">Press to see the details</div>
    </div>
  </section>

  <section id="chat" class="screen" aria-label="Invitation chat">
    <header class="bar">
      <div class="bar-in">
        <span class="back" aria-hidden="true"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></span>
        <div class="avs">
          <img class="av" src="https://vihan1691.github.io/kittu30/assets/kittu-av.jpg" alt="Kittu">
          <span class="av guest" id="guestAv" aria-hidden="true"></span>
        </div>
        <div class="who">
          <div class="nm">Kittu</div>
          <div class="st" id="status">online</div>
        </div>
        <button id="mute" type="button" aria-label="Turn music off" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="m17 9 5 6m0-6-5 6"/></svg>
        </button>
      </div>
    </header>
    <div class="feed" id="feed" role="log" aria-live="polite"></div>
  </section>

  <button id="gate" class="screen" type="button" aria-label="Tap to open the invitation">
    <div class="frame"></div>
    <div class="gate-in">
      <span class="seal" aria-hidden="true"><b>30</b></span>
      <span class="gate-tap">Tap to open</span>
    </div>
  </button>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';

/* ===== Edit these ===== */
var EVENT={
  title:"Kittu's 30th Birthday Celebration",
  dateLabel:"Sunday, 1 November 2026",
  timeLabel:"7:30 PM onwards",
  calStart:"20261101T193000",
  calEnd:"20261101T223000",
  venue:"Mamalola Penthouse, Financial District",
  mapLink:"https://maps.app.goo.gl/jxEhaQk4NBto9Yx28?g_st=ac",
  rsvp:"917032208045"
};
var GUESTS={
  "samarpan-d9c3":{name:"Samarpan",photo:"https://vihan1691.github.io/kittu30/assets/g-samarpan-d9c3.jpg"}
};
var DEFAULT_GUEST="samarpan-d9c3"; /* no match: generic greeting */
var PHOTO="https://vihan1691.github.io/kittu30/assets/kittu-photo.jpg";
/* ======================= */

var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(s){return document.querySelector(s)};
var key=(location.hash||'').slice(1).toLowerCase();
var guest=GUESTS[key]||GUESTS[DEFAULT_GUEST]||{name:'',photo:''};
var gname=guest.name||'';

function h(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function sleep(ms){return new Promise(function(r){setTimeout(r,REDUCED?Math.min(ms,120):ms)})}
function nowT(){try{return new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}catch(e){return ''}}

/* ----- guest setup ----- */
(function(){
  var f=$('#forLine');
  if(gname){f.innerHTML='Specially for <b></b>';f.querySelector('b').textContent=gname}else{f.hidden=true}
  var av=$('#guestAv');
  if(guest.photo){var im=h('img','av guest');im.src=guest.photo;im.alt=gname;av.replaceWith(im)}
  else{av.textContent=gname?gname.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase():'✦'}
})();

/* ===== Confetti ===== */
var cv=$('#confetti'),cx=cv.getContext('2d'),W=0,H=0,parts=[],raf=0,rainUntil=0,lastT=0;
var COLORS=['#F4DE9A','#D6B25E','#E7C976','#B8913B','#FBEBB4','#F5ECD7','#A3202F','#7A1722'];
function size(){var d=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0)}
size();window.addEventListener('resize',size);
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function mk(x,y,vx,vy){
  var strip=Math.random()<.55;
  return {x:x,y:y,vx:vx,vy:vy,w:strip?5+Math.random()*4:6+Math.random()*5,h:strip?10+Math.random()*8:6+Math.random()*5,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,tilt:Math.random()*6.28,vt:.08+Math.random()*.18,
    c:pick(COLORS),round:!strip&&Math.random()<.4}
}
function burst(x,y,n){
  var sc=Math.max(.6,Math.min(W,H)/620);
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.35,s=(6+Math.random()*13)*sc;
    parts.push(mk(x,y,Math.cos(a)*s,Math.sin(a)*s));
  }
  run();
}
function rain(ms){rainUntil=performance.now()+ms;run()}
function run(){if(!raf){lastT=performance.now();raf=requestAnimationFrame(step)}}
function step(t){
  var dt=Math.min((t-lastT)/16.67,2.5);lastT=t;
  cx.clearRect(0,0,W,H);
  if(t<rainUntil){
    for(var k=0;k<2;k++){var p0=mk(Math.random()*W,-14,(Math.random()-.5)*1.6,1.6+Math.random()*2.4);parts.push(p0)}
  }
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.vy+=.22*dt;p.vx*=Math.pow(.985,dt);p.vy*=Math.pow(.992,dt);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.tilt+=p.vt*dt;
    if(p.y>H+24||p.x<-40||p.x>W+40){parts.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.tilt));
    cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2,0,6.283);cx.fill()}else{cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
    cx.restore();
  }
  if(parts.length||t<rainUntil){raf=requestAnimationFrame(step)}else{raf=0;cx.clearRect(0,0,W,H)}
}

/* ===== Music (24K Magic, first 0:40, looped) ===== */
var MUSIC="https://vihan1691.github.io/kittu30/assets/music.mp3";
var actx=null,master=null,buf=null,playing=false,muted=false,wantPlay=false,VOL=.8;
function ensureCtx(){
  if(actx)return true;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    actx=new AC();master=actx.createGain();master.gain.value=0;master.connect(actx.destination);return true;
  }catch(e){return false}
}
function loadMusic(){
  if(!ensureCtx())return;
  try{
    fetch(MUSIC).then(function(r){return r.arrayBuffer()}).then(function(ab){
      var p=actx.decodeAudioData(ab,function(b){buf=b;if(wantPlay)begin()},function(){});
      if(p&&p.catch)p.catch(function(){});
    }).catch(function(){});
  }catch(e){}
}
function begin(){
  if(!buf||!actx||playing)return;
  try{
    var s=actx.createBufferSource();s.buffer=buf;s.loop=true;s.connect(master);s.start(0);
    playing=true;muted=false;
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setTargetAtTime(VOL,actx.currentTime,.25);
    setMuteUI();
  }catch(e){}
}
function startMusic(){
  wantPlay=true;
  if(!ensureCtx())return;
  try{if(actx.resume)actx.resume()}catch(e){}
  begin();
}
function setMuteUI(){var b=$('#mute');var off=muted||!playing;b.classList.toggle('off',off);b.setAttribute('aria-pressed',String(off));b.setAttribute('aria-label',off?'Turn music on':'Turn music off')}
$('#mute').addEventListener('click',function(){
  if(!playing){startMusic();return}
  muted=!muted;
  master.gain.setTargetAtTime(muted?0:VOL,actx.currentTime,.15);
  setMuteUI();
});
document.addEventListener('visibilitychange',function(){
  if(!actx)return;
  try{if(document.hidden){actx.suspend()}else if(wantPlay){actx.resume()}}catch(e){}
});
setMuteUI();
loadMusic();

/* ===== Chat ===== */
var feed=$('#feed'),status=$('#status');
function toBottom(){feed.scrollTo({top:feed.scrollHeight,behavior:REDUCED?'auto':'smooth'})}
function setStatus(s){status.textContent=s}
function typing(){var e=h('div','msg typing','<i></i><i></i><i></i>');e.setAttribute('aria-hidden','true');feed.appendChild(e);toBottom();return e}
function add(el){feed.appendChild(el);toBottom();return el}
function tstamp(){return '<span class="t">'+nowT()+'</span>'}

function msgText(text){var m=h('div','msg');var s=h('span');s.textContent=text;m.appendChild(s);m.insertAdjacentHTML('beforeend',tstamp());return add(m)}
function msgPhoto(){
  var m=h('div','msg photo');var im=h('img');im.src=PHOTO;im.alt='Kittu at a hill-station viewpoint';m.appendChild(im);
  var p=h('p');p.textContent="I'm turning 30, and I would love for you to celebrate it with me.";m.appendChild(p);
  m.insertAdjacentHTML('beforeend',tstamp());return add(m);
}
function msgDate(){
  var m=h('div','msg card','<div class="lbl">Date and time</div><div class="when-row"><div class="cal"><span>NOV</span><b>01</b></div><div class="when"><strong>'+EVENT.dateLabel+'</strong><small>'+EVENT.timeLabel+'</small></div></div>'+tstamp());
  return add(m);
}
function mapUrl(){return EVENT.mapLink||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(EVENT.venue))}
function msgVenue(){
  var pin='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg>';
  var body=EVENT.venue
    ?'<strong></strong><small>Tap below to open the map.</small>'
    :'<strong>Venue to be announced</strong><small>I will send the location right here very soon.</small>';
  var m=h('div','msg card','<div class="lbl">Venue</div><div class="pin-row">'+pin+'<div>'+body+'</div></div>'+tstamp());
  if(EVENT.venue){
    m.querySelector('strong').textContent=EVENT.venue;
    var a=h('a','btn');a.textContent='Open map';a.href=mapUrl();a.target='_blank';a.rel='noopener noreferrer';a.style.marginTop='10px';
    m.querySelector('.pin-row > div').appendChild(a);
  }
  return add(m);
}
function msgDress(){
  var m=h('div','msg card','<div class="lbl">Dress code</div><div class="dti">Dress to Impress</div>'+tstamp());
  return add(m);
}
function link(cls,text,href){var a=h('a',cls);a.textContent=text;a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function rsvpUrl(yes){
  var who=gname?("It's "+gname+". "):"";
  var txt=yes?(who+"I will be there for Kittu's 30th on 1 November. Looking forward to it!"):(who+"Sorry, I can't make it to Kittu's 30th on 1 November, but I'm sending my love.");
  return 'https://wa.me/'+EVENT.rsvp+'?text='+encodeURIComponent(txt);
}
var noted=false;
function msgActions(){
  var m=h('div','msg actions','<div class="lbl">Will you join us?</div>');
  var yes=link('btn yes','Yes, I will be there',rsvpUrl(true));
  var no=link('btn no',"Sorry, I can't make it",rsvpUrl(false));
  m.appendChild(yes);m.appendChild(no);
  m.insertAdjacentHTML('beforeend',tstamp());
  function afterRsvp(e){
    if(noted)return;noted=true;
    var r=e.currentTarget.getBoundingClientRect();
    if(e.currentTarget===yes)burst(r.left+r.width/2,r.top,REDUCED?30:90);
    var n=h('div','note');n.setAttribute('role','status');
    n.textContent='Your reply is ready in WhatsApp. Press send there to confirm.';
    feed.appendChild(n);toBottom();
  }
  yes.addEventListener('click',afterRsvp);no.addEventListener('click',afterRsvp);
  return add(m);
}
function replayBtn(){
  var b=h('button','again');b.type='button';b.textContent='Replay the confetti';
  b.addEventListener('click',function(){burst(W/2,H*.62,REDUCED?40:150);rain(REDUCED?0:3500)});
  feed.appendChild(b);toBottom();
}

async function runChat(){
  setStatus('typing…');
  feed.appendChild(h('div','day','Today'));
  var steps=[
    function(){msgText(guest.greet?(guest.greet+' 🎉'):gname?('Hi '+gname+'! 🎉'):'Hi there! 🎉')},
    msgPhoto,msgDate,msgVenue,msgDress,msgActions
  ];
  await sleep(450);
  for(var i=0;i<steps.length;i++){
    var t=typing();await sleep(i===0?800:1000);t.remove();
    steps[i]();await sleep(700);
  }
  replayBtn();
  setStatus('online');
}

/* ===== Gate: first tap starts the music and reveals the invitation ===== */
$('#gate').addEventListener('click',function(){
  startMusic();
  this.classList.add('leave');
  $('#landing').removeAttribute('inert');
  try{if(navigator.vibrate)navigator.vibrate(20)}catch(e){}
  var g=this;setTimeout(function(){g.hidden=true},900);
},{once:true});

/* ===== Press here ===== */
var started=false;
$('#cta').addEventListener('click',function(){
  if(started)return;started=true;
  var r=this.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,REDUCED?40:180);
  burst(W*.15,H*.9,REDUCED?0:60);burst(W*.85,H*.9,REDUCED?0:60);
  rain(REDUCED?0:6500);
  try{if(navigator.vibrate)navigator.vibrate([40,50,40])}catch(e){}
  startMusic();
  $('#landing').classList.add('leave');
  $('#chat').classList.add('on');
  setTimeout(function(){$('#landing').hidden=true},900);
  setTimeout(runChat,700);
});
})();
</script>

</body>
</html>
